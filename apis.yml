name: Blurb
description: >-
  Blurb is an online self-publishing and print-on-demand platform that lets
  photographers, designers, businesses, and creative storytellers design, print,
  and distribute their own books, magazines, notebooks, and wall art. Founded in
  2005 and headquartered in San Francisco, Blurb provides desktop and web design
  tools (BookWright, Bookify, and plugins for Adobe InDesign and Lightroom)
  alongside professional in-house printing, global fulfillment, and distribution
  through its own bookstore, Amazon, and Ingram. Blurb also offers a RESTful
  print-on-demand API — powered by its RPI Print fulfillment infrastructure — so
  businesses can programmatically submit print orders, upload print-ready PDFs,
  and receive real-time order tracking and fulfillment updates. It was surfaced
  as a portfolio company of Canaan Partners and enriched in the API Evangelist
  network.
